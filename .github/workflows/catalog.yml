name: catalog

# 目的：防止 CATALOG.json 与实际 SKILL.md / PACKAGE.md 内容漂移。
# 策略：PR / push 到 main 时运行 `--check`。若检出漂移，CI fail 并提示贡献者
#       本地运行 `npm run catalog` 后重新提交。
#
# 为何选「检测 + fail」而非「bot 自动 commit」（决策理由）：
#   1. 不让自动化进程获得 main 写权限，降低供应链/凭据风险（最稳妥）。
#   2. 保持 catalog 变更在 PR diff 中可见、可评审，符合「内容即真相源」原则。
#   3. 贡献者本地跑一次脚本即修复，闭环简单，无 force-push / 循环触发风险。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Check CATALOG.json is up to date
        run: npm run catalog:check
